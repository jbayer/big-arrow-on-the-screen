name: Visual

# Records the arrows on a clean runner desktop (nothing personal on screen): screenshots,
# a demo video and GIF. Run by hand: gh workflow run visual.yml
on:
  workflow_dispatch:

jobs:
  visual:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Build
        run: swift build -c release
      - name: What this runner allows
        run: |
          .build/release/bigarrow doctor
          screencapture -x probe.png && sips -g pixelWidth -g pixelHeight probe.png
      - name: Re-run the planning spike over a clean desktop (ticket T03)
        run: |
          mkdir -p visual-out/spike
          cd docs/spikes/2026-10-08-overlay-probe
          swiftc -O -o ../../../visual-out/spike/probe probe.swift
          swiftc -o ../../../visual-out/spike/wincheck wincheck.swift
          cd ../../../visual-out/spike
          ./probe 512 380 & PROBE=$!
          sleep 2
          screencapture -x probe-screenshot.png
          ./wincheck | tee wincheck-output.txt
          wait $PROBE; echo "probe exit $?" | tee -a wincheck-output.txt
      - name: Record
        run: scripts/visual-check.sh visual-out
      - name: Behaviour (clicks, follow, raise, say, second display)
        run: scripts/behaviour-check.sh visual-out/behaviour
        timeout-minutes: 10
      - name: Cue cards (clicks, typing, clipboard, secrets, lifetimes, arrows)
        run: scripts/card-check.sh .build/release/bigarrow visual-out/cards
        timeout-minutes: 6
      - name: Cue card gallery (the 20 use cases, offscreen)
        run: scripts/card-gallery.py .build/release/bigarrow visual-out/card-gallery
      - name: Look over six backgrounds (outline, shadow, close button, colours)
        run: scripts/look-check.sh visual-out/look
        timeout-minutes: 8
      - name: Funny scenes for the README
        run: BACKDROP_ARGS=--cover scripts/funny-scenes.sh visual-out/scenes
      - name: Record the demo GIF
        run: |
          brew install ffmpeg
          scripts/record-demo.sh visual-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual
          path: |
            probe.png
            visual-out/
